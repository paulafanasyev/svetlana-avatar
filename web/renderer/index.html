<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Светлана — Avatar Renderer</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d14;color:#fff;font:14px system-ui}#app{position:relative}canvas{width:100%;height:100%;display:block}header{position:absolute;z-index:2;top:0;left:0;right:0;padding:12px 16px;background:#141827cc;backdrop-filter:blur(8px)}#status{opacity:.8;margin-left:14px}</style></head><body><div id="app"><header><strong>Светлана</strong><span id="status">loading...</span></header><canvas id="viewport"></canvas></div><script type="module">import {createSvetlanaRenderer} from './three-renderer.js';const c=document.querySelector('#viewport'),s=document.querySelector('#status');const modelUrl=new URL('../assets/model/model_base.glb',import.meta.url).href;try{const a=await createSvetlanaRenderer(c,modelUrl);s.textContent=`READY · morphs: ${a.morphs.reduce((n,m)=>n+Object.keys(m.dictionary).length,0)}`;window.SvetlanaRenderer=a}catch(e){s.textContent='MODEL ERROR · '+e.message;console.error(e)}</script></body></html>
