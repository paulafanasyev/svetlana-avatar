name: Svetlana Browser Visual QA
on:
  workflow_dispatch:
    inputs:
      model_url:
        description: 'Canonical model_base.glb URL (must match SHA-256 below)'
        required: true
        type: string
  push:
    paths:
      - 'web/**'
      - 'qa/**'
      - '.github/workflows/visual-artifact.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      MODEL_SHA256: 9a65654d5de83f73201f9577b3fb44478d7ef6d0412b81c2467724a4de1151f5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web dependencies
        run: npm install
        working-directory: web
      - name: Materialize canonical GLB
        env:
          MODEL_URL: ${{ inputs.model_url || secrets.SVETLANA_MODEL_URL }}
        run: |
          test -n "$MODEL_URL" || { echo 'No model URL. Upload the canonical GLB or set SVETLANA_MODEL_URL.'; exit 1; }
          node scripts/prepare-model.mjs
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run preview -- --host 127.0.0.1 > /tmp/svetlana-vite.log 2>&1 &
        working-directory: web
      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/renderer/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/svetlana-vite.log
          exit 1
      - run: npm run qa:browser
        working-directory: web
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svetlana-browser-visual-qa
          path: |
            web/artifacts/
            web/public/assets/model/model_base.glb.sha256
            web/dist/
          if-no-files-found: warn
